name: Public website synchronization audit
on:
  workflow_run:
    workflows: [Deploy static site to GitHub Pages]
    types: [completed]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: public-site-audit
  cancel-in-progress: true
jobs:
  verify:
    if: github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main' && github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      EXPECTED_COMMIT: ${{ github.event.workflow_run.head_sha || github.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build expected artifact
        run: COMMIT_REF="$EXPECTED_COMMIT" node scripts/build-site.mjs
      - name: Compare deployed file hashes and photographic sources
        id: hashes
        continue-on-error: true
        run: node scripts/audit-live.mjs
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install browser test tools
        run: |
          pip install playwright==1.56.0
          python -m playwright install --with-deps chromium
      - name: Test every page on desktop and mobile
        id: browser
        continue-on-error: true
        run: python scripts/browser-audit.py
      - name: Save reports and screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: public-site-audit
          path: reports/
          retention-days: 30
      - name: Require successful audits
        if: steps.hashes.outcome != 'success' || steps.browser.outcome != 'success'
        run: exit 1
