name: Public host diagnostics
on:
  workflow_dispatch:
permissions:
  contents: read
  pages: read
jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build deterministic reference artifact
        run: node scripts/build-site.mjs
      - name: Diagnose HTML byte differences across hosts
        run: node scripts/diagnose-html-diff.mjs
      - name: Inspect public delivery and Pages configuration
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/diagnose-hosts.mjs
      - name: Inspect Cloudinary folder years and periods
        continue-on-error: true
        run: node scripts/check-cloudinary-periods.mjs
      - name: Save public diagnostic responses
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: host-diagnostics
          path: reports/
          retention-days: 7
